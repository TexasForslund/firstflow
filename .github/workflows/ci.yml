name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: firstflow
          POSTGRES_PASSWORD: firstflow
          POSTGRES_DB: firstflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U firstflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Migreringarna stämmer med modellerna
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: OpenAPI-schemat är uppdaterat
        run: |
          uv run python -m scripts.export_openapi
          git diff --exit-code openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API-typerna är uppdaterade
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm run build
